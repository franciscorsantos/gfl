<div id="modalEditarDespesaCartao" class="modal-overlay">
    <div class="modal-content" style="max-width: 650px;">
        <form id="formEditarDespesaCartao" action="" method="POST">
            <div class="modal-header">
                <h3>Editar Despesa do Cartão</h3>
                <button type="button" class="close-btn" onclick="fecharModal('modalEditarDespesaCartao')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit_despesa_id" name="id">
                
                <div class="form-group-full">
                    <label for="edit_despesa_descricao">Descrição da Compra</label>
                    <input type="text" id="edit_despesa_descricao" name="descricao" required placeholder="Ex: Compra de Pneus">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit_despesa_valor_total">Valor Total (R$)</label>
                        <input type="text" id="edit_despesa_valor_total" name="valor_total" required class="input-moeda">
                    </div>
                    <div class="form-group">
                        <label for="edit_despesa_numero_parcelas">Nº de Parcelas</label>
                        <input type="number" id="edit_despesa_numero_parcelas" name="numero_parcelas" min="1" max="24" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="edit_despesa_plano_conta_id">Categoria (Plano de Contas)</label>
                        <select id="edit_despesa_plano_conta_id" name="plano_conta_id" required>
                            <option value="">Selecione uma categoria...</option>
                            {% for plano in opcoes_planos %}{% if 'Despesa' in plano.tipo and '.' in plano.codigo %}
                                <option value="{{ plano.id }}">{{ plano.codigo }} - {{ plano.nome }}</option>
                            {% endif %}{% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="edit_despesa_centro_custo_id">Centro de Custo</label>
                        <select id="edit_despesa_centro_custo_id" name="centro_custo_id" required>
                            <option value="">Selecione um centro de custo...</option>
                            {% for centro in opcoes_centros %}
                                <option value="{{ centro.id }}">{{ centro.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div id="aviso-despesa-paga" style="display: none; margin-top: 16px; padding: 12px; background-color: #fff3cd; border-left: 4px solid #ffeeba; color: #856404; font-size: 14px; border-radius: 4px;">
                    <span class="material-symbols-outlined" style="vertical-align: middle; margin-right: 6px;">warning</span>
                    <span>Esta despesa possui parcelas já pagas. O valor total e o número de parcelas foram bloqueados para alteração.</span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="fecharModal('modalEditarDespesaCartao')">Cancelar</button>
                <button type="submit" class="btn-primary">Salvar Alterações</button>
            </div>
        </form>
    </div>
</div>
