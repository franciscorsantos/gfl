<div id="modalNovoPortador" class="modal-overlay">
    <div class="modal-content">
        <form id="formNovoPortador">
            <!-- Campo oculto para guardar o ID durante a edição -->
            <input type="hidden" id="portador_id_edit">
            <div class="modal-header">
                <h3>Portador (Conta)</h3>
                <button type="button" class="close-btn" onclick="fecharModal('modalNovoPortador')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group-full">
                    <label for="nome_portador">Nome do Portador</label>
                    <input type="text" id="nome_portador" name="nome" required placeholder="Ex: Banco do Brasil, Caixa Interno">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="tipo_portador">Tipo</label>
                        <select id="tipo_portador" name="tipo" required>
                            <option value="Banco">Banco</option>
                            <option value="Caixa Físico">Caixa Físico</option>
                            <option value="Adiantamento">Adiantamento</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="saldo_inicial_portador">Saldo Inicial (R$)</label>
                        <input type="text" id="saldo_inicial_portador" name="saldo_inicial" required class="input-moeda" value="0,00">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="fecharModal('modalNovoPortador')">Cancelar</button>
                <button type="submit" class="btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>
