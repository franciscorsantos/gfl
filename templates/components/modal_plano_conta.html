<div id="modalNovoPlano" class="modal-overlay">
    <div class="modal-content">
        <form id="formNovoPlano">
            <input type="hidden" id="plano_conta_id_edit">
            <div class="modal-header">
                <h3>Plano de Contas</h3>
                <button type="button" class="close-btn" onclick="fecharModal('modalNovoPlano')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label for="codigo_plano">Código</label>
                        <input type="text" id="codigo_plano" name="codigo" required placeholder="Ex: 01.01">
                    </div>
                    <div class="form-group">
                        <label for="tipo_plano">Tipo</label>
                        <select id="tipo_plano" name="tipo" required>
                            <option value="Receita">Receita</option>
                            <option value="Despesa">Despesa</option>
                        </select>
                    </div>
                </div>
                <div class="form-group-full">
                    <label for="nome_plano">Nome da Conta</label>
                    <input type="text" id="nome_plano" name="nome" required>
                </div>
                 <div class="form-group-full">
                    <label for="parent_id_plano">Conta Pai (Sintética)</label>
                    <select id="parent_id_plano" name="parent_id">
                        <option value="">Nenhuma (Conta Principal)</option>
                        {% for p in opcoes_planos %}{% if '.' not in p.codigo %}<option value="{{ p.id }}">{{ p.codigo }} - {{ p.nome }}</option>{% endif %}{% endfor %}
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="fecharModal('modalNovoPlano')">Cancelar</button>
                <button type="submit" class="btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>
