{% extends 'base.html' %}

{% block content %}
<div class="dashboard-header" style="justify-content: space-between; align-items: center; background-color: var(--cor-fundo-card); border: 1px solid var(--cor-borda); margin-bottom: 24px;">
    <div>
        <h2>Lançar Nova Conta a Pagar</h2>
        <p style="color: var(--cor-texto-suave);">Preencha os dados para registrar uma nova despesa ou compra parcelada.</p>
    </div>
</div>

<div class="form-container">
    <form id="formNovaContaPagar">
        <div class="modal-body" style="padding: 0;">
            
            <h3 style="font-size: 16px; border-bottom: 1px solid var(--cor-borda); padding-bottom: 12px; margin-bottom: 20px;">Dados da Despesa</h3>
            
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="conta_fornecedor_id">Fornecedor</label>
                    <select name="fornecedor_id" id="conta_fornecedor_id" required>
                        <option value="" disabled selected>Selecione um fornecedor</option>
                        {% for f in opcoes_fornecedores %}
                        <option value="{{ f.id }}">{{ f.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="conta_data_emissao">Data de Emissão</label>
                    <input type="date" name="data_emissao" id="conta_data_emissao" required>
                </div>
            </div>

            <div class="form-group-full">
                <label for="conta_descricao">Descrição da Despesa</label>
                <input type="text" name="descricao" id="conta_descricao" placeholder="Ex: Compra de material de escritório" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="conta_tipo_documento">Tipo de Documento</label>
                    <select id="conta_tipo_documento" name="tipo_documento">
                        <option value="NFe">NFe (Nota Fiscal Eletrônica)</option>
                        <option value="CTe">CTe (Conhecimento de Transporte)</option>
                        <option value="Fatura">Fatura</option>
                        <option value="Recibo">Recibo</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="conta_numero_documento">Número do Documento</label>
                    <input type="text" name="numero_documento" id="conta_numero_documento">
                </div>
                <div class="form-group">
                    <label for="conta_valor_total">Valor Total (R$)</label>
                    <input type="text" name="valor_total" id="conta_valor_total" placeholder="0,00" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="conta_plano_conta_id">Categoria (Plano de Contas)</label>
                    <select name="plano_conta_id" id="conta_plano_conta_id" required>
                        <option value="" disabled selected>Selecione a categoria</option>
                        {% for p in opcoes_planos %}
                            {% if p.tipo == 'Despesa' %}
                            <option value="{{ p.id }}">{{ p.codigo }} - {{ p.nome }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="conta_centro_custo_id">Centro de Custo</label>
                    <select name="centro_custo_id" id="conta_centro_custo_id" required>
                        <option value="" disabled selected>Selecione o centro de custo</option>
                        {% for c in opcoes_centros %}
                        <option value="{{ c.id }}">{{ c.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <h3 style="font-size: 16px; border-bottom: 1px solid var(--cor-borda); padding-bottom: 12px; margin-top: 32px; margin-bottom: 20px;">Condição de Pagamento</h3>

            <div class="form-group-full">
                <label for="condicao_pagamento">Tipo de Pagamento</label>
                <select name="condicao_pagamento" id="condicao_pagamento">
                    <option value="vista">À Vista</option>
                    <option value="fixo" selected>Parcelado (Carnê / Fixo)</option>
                    <option value="dinamico">Parcelado (Dinâmico)</option>
                </select>
            </div>

            <!-- O CONTEÚDO AQUI SERÁ GERADO PELO JAVASCRIPT (main.js) -->
            <div id="campos_pagamento_container"></div>

        </div>
        <div class="modal-footer" style="padding: 24px 0 0 0;">
            <button type="submit" class="btn-primary">Salvar Conta a Pagar</button>
        </div>
    </form>
</div>

<style>
    .form-container {
        max-width: none; /* Faz o container ocupar toda a largura disponível */
    }
    .total-parcelas-footer { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--cor-borda); display: flex; justify-content: flex-end; align-items: center; gap: 16px; }
    .total-ok { color: var(--cor-sucesso); font-weight: 500; }
    .total-erro { color: var(--cor-perigo); font-weight: 500; }
    .parcela-preview-table { margin-top: 16px; }
</style>

{% endblock %}
